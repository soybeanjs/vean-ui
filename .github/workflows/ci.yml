name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Dependency gate
        run: pnpm check:deps

      - name: Generated data drift
        run: pnpm check:generated

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Size gate. The baseline is the report written by the previous main-branch
      # run (same runner, same lockfile), so a PR compares against an
      # apples-to-apples build without building the base branch a second time.
      # A missing baseline degrades to budget-only reporting instead of failing.
      - name: Restore size baseline
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          key: size-baseline-${{ github.event.pull_request.base.sha }}
          path: .size-cache/size-baseline.json
          restore-keys: size-baseline-

      - name: Size budget gate
        run: pnpm check:size

      # Runs even when the gate failed, so the report (and its job summary,
      # written by the step above) is still available for review.
      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: .size-report
          # `.size-report` is a dot-directory, and upload-artifact skips hidden
          # files by default — without this the artifact is never created and
          # the `size-comment` job has nothing to download.
          include-hidden-files: true

      - name: Stage size baseline
        if: github.event_name == 'push'
        run: |
          mkdir -p .size-cache
          cp .size-report/size-report.json .size-cache/size-baseline.json

      - name: Save size baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          key: size-baseline-${{ github.sha }}
          path: .size-cache/size-baseline.json

  # Split from `ci` so the job that executes pull-request code never holds a
  # write token: this job only downloads the report artifact.
  size-comment:
    name: Size report comment
    needs: ci
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download size report
        # A missing report (build failed before the measurement) must not turn
        # into a second, unrelated failure on the pull request.
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: size-report
          path: .size-report

      - name: Comment size report
        if: steps.download.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bundle-size
          path: .size-report/size-report.md

  e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Install Playwright chromium
        run: pnpm --filter @vean/ui exec playwright install --with-deps chromium

      - name: Browser e2e tests
        run: pnpm test:e2e
