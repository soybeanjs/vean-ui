packages:
  - 'packages/**'
  - 'apps/**'
  # ubean writes a runtime package.json into `dist/server`; keep build output out of the workspace.
  - '!apps/**/dist/**'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
  typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2
overrides:
  vite: 'catalog:'
  vitest: '5.0.5'
  typescript: 'catalog:'
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
allowBuilds:
  esbuild: false
  maplibre-gl: false
  vue-demi: false
minimumReleaseAge: 0
