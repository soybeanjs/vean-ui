packages:
  - 'packages/**'
  - 'apps/**'
  - 'benchmarks'
  # ubean writes a runtime package.json into `dist/server`; keep build output out of the workspace.
  - '!apps/**/dist/**'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  typescript: npm:typescript-native-bridge@latest
overrides:
  vite: 'catalog:'
  vitest: '5.0.5'
  typescript: 'catalog:'
shamefullyHoist: true
ignoreWorkspaceRootCheck: true
linkWorkspacePackages: true
allowBuilds:
  esbuild: false
  maplibre-gl: false
  vue-demi: false
minimumReleaseAge: 0
